name: Role Inline Service Wildcard
description: Identifies IAM Roles that have inline policies with service-specific wildcard (service:*) actions.
impactedServices:
  - IAM
severity: High
cypher: |
  // Find IAM Roles with service wildcard inline policies
  MATCH (role:AWS_IAM_ROLE) 
  WHERE role.rolePolicyList IS NOT NULL 
    AND role.rolePolicyList <> 'null'
    AND role.rolePolicyList <> '[]'
    // Check for service wildcard with a resource wildcard in the same statement
    AND role.rolePolicyList CONTAINS ':*"]' 
    AND role.rolePolicyList CONTAINS '"Resource":["*"]'
    // Exclude cases already covered by full wildcard and IAM wildcard
    AND NOT (
      (role.rolePolicyList CONTAINS '"Action":["*"]' AND role.rolePolicyList CONTAINS '"Resource":["*"]') OR
      (role.rolePolicyList CONTAINS '"Action":"*"' AND role.rolePolicyList CONTAINS '"Resource":"*"') OR
      (role.rolePolicyList CONTAINS '"Action":["iam:*"]')
    )
  RETURN 
      role.arn AS vulnerable, 
      role.rolePolicyList AS policy 