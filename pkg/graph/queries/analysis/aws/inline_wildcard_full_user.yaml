name: User Inline Full Wildcard
description: Identifies IAM Users that have inline policies with full wildcard (*) actions and resources.
impactedServices:
  - IAM
severity: High
cypher: |
  // Find IAM Users with full wildcard inline policies
  MATCH (user:AWS_IAM_User) 
  WHERE user.userPolicyList IS NOT NULL 
    AND user.userPolicyList <> 'null'
    AND user.userPolicyList <> '[]'
    // Check for full wildcard actions and resources in the same policy
    AND (
      (user.userPolicyList CONTAINS '"Action":["*"]' AND user.userPolicyList CONTAINS '"Resource":["*"]') OR
      (user.userPolicyList CONTAINS '"Action":"*"' AND user.userPolicyList CONTAINS '"Resource":"*"')
    )
  RETURN 
      user.arn AS vulnerable, 
      user.userPolicyList AS policy 