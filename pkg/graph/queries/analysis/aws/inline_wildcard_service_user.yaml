name: User Inline Service Wildcard
description: Identifies IAM Users that have inline policies with service-specific wildcard (service:*) actions.
impactedServices:
  - IAM
severity: High
cypher: |
  // Find IAM Users with service wildcard inline policies
  MATCH (user:`AWS::IAM::User`) 
  WHERE user.userPolicyList IS NOT NULL 
    AND user.userPolicyList <> 'null'
    AND user.userPolicyList <> '[]'
    // Check for service wildcard with a resource wildcard in the same statement
    AND user.userPolicyList CONTAINS ':*"]' 
    AND user.userPolicyList CONTAINS '"Resource":["*"]'
    // Exclude cases already covered by full wildcard and IAM wildcard
    AND NOT (
      (user.userPolicyList CONTAINS '"Action":["*"]' AND user.userPolicyList CONTAINS '"Resource":["*"]') OR
      (user.userPolicyList CONTAINS '"Action":"*"' AND user.userPolicyList CONTAINS '"Resource":"*"') OR
      (user.userPolicyList CONTAINS '"Action":["iam:*"]')
    )
  RETURN 
      user.arn AS vulnerable, 
      user.userPolicyList AS policy 