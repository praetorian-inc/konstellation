name: Role Inline IAM Wildcard
description: Identifies IAM Roles that have inline policies with IAM wildcard (iam:*) actions.
impactedServices:
  - IAM
severity: High
cypher: |
  // Find IAM Roles with IAM wildcard inline policies
  MATCH (role:AWS_IAM_Role)
  WHERE role.rolePolicyList IS NOT NULL 
    AND role.rolePolicyList <> 'null'
    AND role.rolePolicyList <> '[]'
    // Check for IAM wildcard action with any wildcard resource
    AND role.rolePolicyList CONTAINS '"Action":["iam:*"]' 
    AND (role.rolePolicyList CONTAINS '"Resource":["*"]' OR role.rolePolicyList CONTAINS 'arn:aws:iam::*')
  RETURN 
      role.arn AS vulnerable, 
      role.rolePolicyList AS policy 