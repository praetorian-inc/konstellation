name: Privilege Escalation Paths
description: Identifies principals that can escalate to admin privileges through CAN_PRIVESC relationships (1-3 hops)
impactedServices:
  - IAM
  - STS
  - Lambda
  - EC2
  - Glue
  - CloudFormation
  - SSM
  - ECS
  - DataPipeline
severity: High
cypher: |
  // Find minimum hops for each principal to reach an admin-capable target.
  // A "target" here counts as admin-capable if any of:
  //   - target.admin = true               -> the target IS admin
  //   - target.canSelfEscalate = true     -> target can self-attach a policy
  //   - target.canBeMadeAdmin = true      -> target can promote a role to admin
  //                                          and weaponize it (the actor side
  //                                          of method_09 / method_12 / method_28).
  MATCH path = (principal)-[:CAN_PRIVESC*1..3]->(target)
  WHERE principal.admin IS NULL
    AND (
      target.admin = true
      OR target.canSelfEscalate = true
      OR target.canBeMadeAdmin = true
    )

  WITH principal, min(length(path)) AS minHops

  // Get all paths at minimum hop distance
  MATCH path = (principal)-[:CAN_PRIVESC*1..3]->(target)
  WHERE principal.admin IS NULL
    AND (
      target.admin = true
      OR target.canSelfEscalate = true
      OR target.canBeMadeAdmin = true
    )
    AND length(path) = minHops

  RETURN principal.arn AS vulnerable,
         [n IN nodes(path)[1..-1] | n.arn] AS intermediateTargets,
         collect(DISTINCT target.arn) AS finalTargets,
         length(path) AS hops,
         [rel IN relationships(path) | rel.method] AS methods
  ORDER BY vulnerable
