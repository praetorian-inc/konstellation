name: Privesc Method 6 - Update Login Profile
description: Creates CAN_PRIVESC relationship when a principal can update login profiles for privileged users
impactedServices:
  - IAM
severity: High
cypher: |
  MATCH (principal)-[:`iam:UpdateLoginProfile`]->(user:`IAM::User`)
  WHERE principal.admin IS NULL
    AND user.admin = true

  // Create the privesc relationship
  MERGE (principal)-[privesc:CAN_PRIVESC]->(user)
  ON CREATE SET
    privesc.method = "Method-06-UpdateLoginProfile",
    privesc.requires = ["iam:UpdateLoginProfile"],
    privesc.service = "IAM",
    privesc.targetType = "User"
  ON MATCH SET
    privesc.method = CASE
      WHEN NOT privesc.method CONTAINS "Method-06-UpdateLoginProfile"
      THEN privesc.method + ",Method-06-UpdateLoginProfile"
      ELSE privesc.method
    END

  WITH principal, collect(DISTINCT user) AS users
  RETURN principal.arn AS vulnerable
