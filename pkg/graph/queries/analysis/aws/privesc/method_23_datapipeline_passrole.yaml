name: Privesc Method 23 - DataPipeline PassRole
description: Creates CAN_PRIVESC relationship when a principal can pass privileged roles to Data Pipeline
impactedServices:
  - IAM
  - DataPipeline
severity: High
cypher: |
  MATCH (principal)-[:`iam:PassRole`]->(targetRole:`IAM::Role`)
  WHERE principal.admin IS NULL
    AND 'datapipeline.amazonaws.com' IN targetRole.trustedServices
    AND (EXISTS((principal)-[:`datapipeline:CreatePipeline`]->())
         OR EXISTS((principal)-[:`datapipeline:PutPipelineDefinition`]->()))
    AND (targetRole.admin = true
      OR (principal:User AND
          (EXISTS((principal)-[:`iam:PutRolePolicy`]->(targetRole))
           OR EXISTS((principal)-[:`iam:AttachRolePolicy`]->(targetRole)))))

  // Create the privesc relationship
  MERGE (principal)-[privesc:CAN_PRIVESC]->(targetRole)
  ON CREATE SET
    privesc.method = "Method-23-DataPipeline-PassRole",
    privesc.requires = ["iam:PassRole", "datapipeline:CreatePipeline"],
    privesc.service = "DataPipeline",
    privesc.targetType = "Role"
  ON MATCH SET
    privesc.method = CASE
      WHEN NOT privesc.method CONTAINS "Method-23-DataPipeline-PassRole"
      THEN privesc.method + ",Method-23-DataPipeline-PassRole"
      ELSE privesc.method
    END

  RETURN count(DISTINCT principal) AS PrincipalsWithPrivesc
