name: Privesc Method 10 - CreateLoginProfile
description: Creates CAN_PRIVESC relationship when a principal can create login profiles for other users
impactedServices:
  - IAM
severity: High
cypher: |
  MATCH (principal)-[:`iam:CreateLoginProfile`]->(user)
  WHERE (user:User OR user:`IAM::User`)
    AND principal.admin IS NULL

  // Create the privesc relationship
  MERGE (principal)-[privesc:CAN_PRIVESC]->(user)
  ON CREATE SET
    privesc.method = "Method-10-CreateLoginProfile",
    privesc.requires = ["iam:CreateLoginProfile"],
    privesc.service = "IAM",
    privesc.targetType = "User"
  ON MATCH SET
    privesc.method = CASE
      WHEN NOT privesc.method CONTAINS "Method-10-CreateLoginProfile"
      THEN privesc.method + ",Method-10-CreateLoginProfile"
      ELSE privesc.method
    END

