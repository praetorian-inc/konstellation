name: Privesc Method 13 - AssumeRole
description: Creates CAN_PRIVESC relationship when a principal can directly assume other roles
impactedServices:
  - STS
  - IAM
severity: High
cypher: |
  MATCH (principal)-[:`sts:AssumeRole`]->(targetRole:`IAM::Role`)
  WHERE principal.admin IS NULL
    AND targetRole.assumeRolePolicyDoc IS NOT NULL
    AND (
      targetRole.assumeRolePolicyDoc CONTAINS principal.arn
      OR (targetRole.trustsAccountRoot = true
          AND principal.arn STARTS WITH targetRole.arn[0..26])
      OR targetRole.trustsPublic = true
    )

  // Create the privesc relationship
  MERGE (principal)-[privesc:CAN_PRIVESC]->(targetRole)
  ON CREATE SET
    privesc.method = "Method-13-AssumeRole",
    privesc.requires = ["sts:AssumeRole"],
    privesc.service = "STS",
    privesc.targetType = "Role",
    privesc.discovered = datetime(),
    privesc.trustsPublic = (targetRole.trustsPublic = true)
  ON MATCH SET
    privesc.method = CASE
      WHEN NOT privesc.method CONTAINS "Method-13-AssumeRole"
      THEN privesc.method + ",Method-13-AssumeRole"
      ELSE privesc.method
    END

  WITH principal, collect(DISTINCT targetRole) AS targetRoles
  RETURN principal.arn AS vulnerable
