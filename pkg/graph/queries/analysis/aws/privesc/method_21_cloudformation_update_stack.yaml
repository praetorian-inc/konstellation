name: Privesc Method 21 - CloudFormation UpdateStack
description: Creates CAN_PRIVESC relationship when a principal can pass privileged roles to CloudFormation stack updates
impactedServices:
  - IAM
  - CloudFormation
severity: High
cypher: |
  MATCH (principal)-[:`iam:PassRole`]->(targetRole:`IAM::Role`)
  WHERE principal.admin IS NULL
    AND 'cloudformation.amazonaws.com' IN targetRole.trustedServices
    AND EXISTS((principal)-[:`cloudformation:UpdateStack`]->())
    AND (targetRole.admin = true
      OR (principal:User AND
          (EXISTS((principal)-[:`iam:PutRolePolicy`]->(targetRole))
           OR EXISTS((principal)-[:`iam:AttachRolePolicy`]->(targetRole)))))

  // Create the privesc relationship
  MERGE (principal)-[privesc:CAN_PRIVESC]->(targetRole)
  ON CREATE SET
    privesc.method = "Method-21-CloudFormation-UpdateStack",
    privesc.requires = ["iam:PassRole", "cloudformation:UpdateStack"],
    privesc.service = "CloudFormation",
    privesc.targetType = "Role"
  ON MATCH SET
    privesc.method = CASE
      WHEN NOT privesc.method CONTAINS "Method-21-CloudFormation-UpdateStack"
      THEN privesc.method + ",Method-21-CloudFormation-UpdateStack"
      ELSE privesc.method
    END

  RETURN principal.arn AS vulnerable
