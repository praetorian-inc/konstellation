name: Role Inline Full Wildcard
description: Identifies IAM Roles that have inline policies with full wildcard (*) actions and resources.
impactedServices:
  - IAM
severity: High
cypher: |
  // Find IAM Roles with full wildcard inline policies
  MATCH (role:AWS_IAM_Role)
  WHERE role.rolePolicyList IS NOT NULL 
    AND role.rolePolicyList <> 'null'
    AND role.rolePolicyList <> '[]'
    // Check for full wildcard actions and resources in the same policy
    AND (
      (role.rolePolicyList CONTAINS '"Action":["*"]' AND role.rolePolicyList CONTAINS '"Resource":["*"]') OR
      (role.rolePolicyList CONTAINS '"Action":"*"' AND role.rolePolicyList CONTAINS '"Resource":"*"')
    )
  RETURN 
      role.arn AS vulnerable, 
      role.rolePolicyList AS policy 