name: Privilege Escalation via AssumeRole with AdministratorAccess
description: Identifies IAM roles that can escalate privileges by assuming roles with AdministratorAccess through one or more hops.
impactedServices:
  - IAM
severity: High
cypher: |
  // Find shortest paths to roles with AdministratorAccess
  MATCH p=(source:Principal)-[r:STS_ASSUMEROLE*1..3]->(target:AWS_IAM_Role)
  WHERE 
      // Target role has AdministratorAccess
      (target.attachedManagedPolicies IS NOT NULL AND 
      ANY(policy IN target.attachedManagedPolicies WHERE policy CONTAINS 'AdministratorAccess'))
      
      // Source role doesn't have AdministratorAccess
      AND (source.attachedManagedPolicies IS NULL OR 
          NOT ANY(policy IN source.attachedManagedPolicies WHERE policy CONTAINS 'AdministratorAccess'))
      
      // Source role doesn't have powerful inline policies with wildcard actions
      AND (source.rolePolicyList IS NULL OR
          source.rolePolicyList = 'null' OR
          source.rolePolicyList = '[]' OR
          NOT (
              // Exclude any full wildcard "*" action patterns
              source.rolePolicyList CONTAINS '"Action":["*"]' OR
              source.rolePolicyList CONTAINS '"Action":"*"' OR
              
              // Exclude IAM wildcard with any resource
              (source.rolePolicyList CONTAINS '"Action":["iam:*"]' AND 
                  (source.rolePolicyList CONTAINS '"Resource":["*"]' OR 
                   source.rolePolicyList CONTAINS 'arn:aws:iam::*'))
          ))
      
      // Exclude AWS reserved or service roles
      AND NOT (source.roleName STARTS WITH 'AWSReservedSSO_')
      
      // Filter out self-references
      AND source.roleName <> target.roleName
      
      // Ensure all nodes in path have valid ARNs
      AND ALL(node IN nodes(p) WHERE node.arn IS NOT NULL)

  // Check for cycles - ensure no ARN appears more than once in the path
  WITH p, source, target,
       [node IN nodes(p) | node.arn] AS pathArns
  WHERE 
       // Count occurrences of each ARN and ensure none appear more than once
       NOT ANY(arn IN pathArns WHERE size([a IN pathArns WHERE a = arn]) > 1)

  // Ensure all intermediate nodes don't have AdminAccess - path stops at first admin role
  WITH p, source, target, 
       [node IN nodes(p) WHERE node <> source AND node <> target] AS intermediateNodes
  WHERE ALL(node IN intermediateNodes WHERE 
        // Intermediate nodes don't have AdministratorAccess managed policy
        (node.attachedManagedPolicies IS NULL OR 
         NOT ANY(policy IN node.attachedManagedPolicies WHERE policy CONTAINS 'AdministratorAccess'))
        
        // Intermediate nodes don't have admin-equivalent inline policies
        AND (node.rolePolicyList IS NULL OR
             node.rolePolicyList = 'null' OR
             node.rolePolicyList = '[]' OR
             NOT (
                 node.rolePolicyList CONTAINS '"Action":["*"]' OR
                 node.rolePolicyList CONTAINS '"Action":"*"' OR
                 (node.rolePolicyList CONTAINS '"Action":["iam:*"]' AND 
                  (node.rolePolicyList CONTAINS '"Resource":["*"]' OR 
                   node.rolePolicyList CONTAINS 'arn:aws:iam::*'))
             ))
  )
  
  // Only return the shortest path to each target
  WITH source, target, p, length(p) AS pathLength
  ORDER BY source, pathLength
  WITH source, target, collect(p)[0] AS shortestPath
  
  // Return distinct paths to avoid duplicates
  RETURN DISTINCT source.arn as vulnerable, shortestPath as path