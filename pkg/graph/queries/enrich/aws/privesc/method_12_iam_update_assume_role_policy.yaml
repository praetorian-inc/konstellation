name: Privesc Method 12 - UpdateAssumeRolePolicy
description: Creates CAN_PRIVESC relationship when a principal can update trust policies of roles
impactedServices:
  - IAM
severity: High
order: 111
cypher: |
  MATCH (principal)-[:`iam:UpdateAssumeRolePolicy`]->(targetRole:`IAM::Role`)
  WHERE principal.admin IS NULL
    AND EXISTS((principal)-[:`sts:AssumeRole`]->(targetRole))

  // Create the privesc relationship
  MERGE (principal)-[privesc:CAN_PRIVESC]->(targetRole)
  ON CREATE SET
    privesc.method = "Method-12-UpdateAssumeRolePolicy",
    privesc.requires = ["iam:UpdateAssumeRolePolicy", "sts:AssumeRole"],
    privesc.service = "IAM",
    privesc.targetType = "Role"
  ON MATCH SET
    privesc.method = CASE
      WHEN NOT privesc.method CONTAINS "Method-12-UpdateAssumeRolePolicy"
      THEN privesc.method + ",Method-12-UpdateAssumeRolePolicy"
      ELSE privesc.method
    END

