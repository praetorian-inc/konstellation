name: Privesc Method 22 - CloudFormation ChangeSet
description: Creates CAN_PRIVESC relationship when a principal can pass privileged roles to CloudFormation changesets
impactedServices:
  - IAM
  - CloudFormation
severity: High
cypher: |
  MATCH (principal)-[:`iam:PassRole`]->(targetRole:`IAM::Role`)
  WHERE principal.admin IS NULL
    AND 'cloudformation.amazonaws.com' IN targetRole.trustedServices
    AND EXISTS((principal)-[:`cloudformation:CreateChangeSet`]->())
    AND EXISTS((principal)-[:`cloudformation:ExecuteChangeSet`]->())
    AND (targetRole.admin = true
      OR (principal:User AND
          (EXISTS((principal)-[:`iam:PutRolePolicy`]->(targetRole))
           OR EXISTS((principal)-[:`iam:AttachRolePolicy`]->(targetRole)))))

  // Create the privesc relationship
  MERGE (principal)-[privesc:CAN_PRIVESC]->(targetRole)
  ON CREATE SET
    privesc.method = "Method-22-CloudFormation-ChangeSet",
    privesc.requires = ["iam:PassRole", "cloudformation:CreateChangeSet", "cloudformation:ExecuteChangeSet"],
    privesc.service = "CloudFormation",
    privesc.targetType = "Role"
  ON MATCH SET
    privesc.method = CASE
      WHEN NOT privesc.method CONTAINS "Method-22-CloudFormation-ChangeSet"
      THEN privesc.method + ",Method-22-CloudFormation-ChangeSet"
      ELSE privesc.method
    END

  RETURN count(DISTINCT principal) AS PrincipalsWithPrivesc
