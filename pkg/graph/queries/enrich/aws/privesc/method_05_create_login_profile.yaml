name: Privesc Method 5 - Create Login Profile
description: Creates CAN_PRIVESC relationship when a principal can create login profiles for privileged users
impactedServices:
  - IAM
severity: High
cypher: |
  MATCH (principal)-[:`iam:CreateLoginProfile`]->(user)
  WHERE (user:User OR user:`IAM::User`)
    AND principal.admin IS NULL
    AND user.admin = true

  // Create the privesc relationship
  MERGE (principal)-[privesc:CAN_PRIVESC]->(user)
  ON CREATE SET
    privesc.method = "Method-05-CreateLoginProfile",
    privesc.requires = ["iam:CreateLoginProfile"],
    privesc.service = "IAM",
    privesc.targetType = "User"
  ON MATCH SET
    privesc.method = CASE
      WHEN NOT privesc.method CONTAINS "Method-05-CreateLoginProfile"
      THEN privesc.method + ",Method-05-CreateLoginProfile"
      ELSE privesc.method
    END

  RETURN count(DISTINCT principal) AS PrincipalsWithPrivesc
