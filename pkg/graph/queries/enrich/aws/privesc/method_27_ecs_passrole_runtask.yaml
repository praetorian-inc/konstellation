name: Privesc Method 27 - ECS PassRole RunTask
description: Creates CAN_PRIVESC relationship when a principal can pass privileged roles to ECS tasks
impactedServices:
  - IAM
  - ECS
severity: High
cypher: |
  MATCH (principal)-[:`iam:PassRole`]->(targetRole:Role)
  WHERE principal.admin IS NULL
    AND EXISTS((principal)-[:`ecs:RunTask`]->())
    AND 'ecs-tasks.amazonaws.com' IN targetRole.trustedServices
    AND (targetRole.admin = true
      OR (principal:User AND
          (EXISTS((principal)-[:`iam:PutRolePolicy`]->(targetRole))
           OR EXISTS((principal)-[:`iam:AttachRolePolicy`]->(targetRole)))))

  // Create the privesc relationship
  MERGE (principal)-[privesc:CAN_PRIVESC]->(targetRole)
  ON CREATE SET
    privesc.method = "Method-27-ECS-PassRole-RunTask",
    privesc.requires = ["iam:PassRole", "ecs:RunTask"],
    privesc.service = "ECS",
    privesc.targetType = "Role"
  ON MATCH SET
    privesc.method = CASE
      WHEN NOT privesc.method CONTAINS "Method-27-ECS-PassRole-RunTask"
      THEN privesc.method + ",Method-27-ECS-PassRole-RunTask"
      ELSE privesc.method
    END

  RETURN count(DISTINCT principal) AS PrincipalsWithPrivesc
