name: Set Admin Administrator Access
description: Sets the admin attribute to true for principals with AdministratorAccess policy
impactedServices:
  - IAM
severity: Informational
order: 30
cypher: |
  MATCH (p:Principal)
  WHERE p.attachedManagedPolicies CONTAINS "arn:aws:iam::aws:policy/AdministratorAccess"
    OR p.attachedManagedPolicies CONTAINS "arn:aws:iam::aws:policy/IAMFullAccess"
  SET p.admin = true