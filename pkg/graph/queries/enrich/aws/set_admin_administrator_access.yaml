name: Set Admin Administrator Access
description: Sets the admin attribute to true for principals with AdministratorAccess policy
impactedServices:
  - IAM
severity: Informational
order: 30
cypher: |
  MATCH (p:Principal)
  WHERE "arn:aws:iam::aws:policy/AdministratorAccess" CONTAINS p.attachedManagedPolicies
     OR "arn:aws:iam::aws:policy/IAMFullAccess" CONTAINS p.attachedManagedPolicies
  SET p.admin = true